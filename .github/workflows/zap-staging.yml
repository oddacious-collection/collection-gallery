# ZAP baseline (passive) scan of staging (SEC-16, D-67). Runs after every
# staging deploy (called from ci.yml) and weekly, so a quiet month still gets
# scanned; GitHub emails the owner when a scheduled run fails. The scan goes
# through Cloudflare Access with the CI service token; the public step summary
# gets the report only after every secret and account-identifying value has
# been redacted (D-37).
name: ZAP staging scan

on:
  workflow_call:
  schedule:
    - cron: '47 6 * * 1' # Mondays 06:47 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: zap-staging
  cancel-in-progress: false

jobs:
  zap:
    name: ZAP baseline scan (staging, SEC-16)
    if: vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
    env:
      TARGET: ${{ secrets.STAGING_PUBLIC_URL }}
    steps:
      # D-37: account-identifying values are environment *secrets*, so GitHub
      # masks them in these public logs. Tools also print shorter forms of them
      # (the bare hostname, the workers.dev subdomain, the Access team name), so
      # mask those too. Masks are per job: keep this the first step.
      - name: Mask account-identifying values in logs (D-37)
        env:
          PUBLIC_URL: ${{ secrets.STAGING_PUBLIC_URL }}
          TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
        run: |
          set -euo pipefail
          host="${PUBLIC_URL#https://}"; host="${host%%/*}"
          sub="${host#*.}"; sub="${sub%%.*}"
          team="${TEAM_DOMAIN#https://}"; team="${team%%.*}"
          for v in "${host}" "${sub}" "${team}"; do
            if [ -n "${v}" ]; then echo "::add-mask::${v}"; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Access doesn't issue a session cookie to service tokens, so ZAP sends
      # the two service-token headers itself (replacer rules), scoped to the
      # staging host so they're never sent anywhere else.
      - name: Run ZAP baseline (passive) scan
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ADMIN_URL: ${{ secrets.STAGING_ADMIN_URL }}
          TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
        run: |
          set -uo pipefail
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R 777 zap
          host="${TARGET#https://}"; host="${host%%/*}"
          # The staging host only, with or without a path: ZAP also requests the
          # bare origin (no trailing slash).
          scope="^https://${host//./\\.}(/.*)?$"
          rule() { # index, header, value
            printf -- '-config replacer.full_list(%s).%s ' \
              "$1" "description=$2" "$1" "enabled=true" "$1" "matchtype=REQ_HEADER" \
              "$1" "matchstr=$2" "$1" "regex=false" "$1" "replacement=$3" \
              "$1" "url=${scope}"
          }
          zopts="$(rule 0 CF-Access-Client-Id "${CF_ACCESS_CLIENT_ID}")$(rule 1 CF-Access-Client-Secret "${CF_ACCESS_CLIENT_SECRET}")"
          zopts="${zopts% }"
          docker run --rm -v "${PWD}/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t "${TARGET}" -c rules.tsv -w report.md -I -z "${zopts}" \
            | tee zap/console.txt
          status=${PIPESTATUS[0]}
          # Prove the scan got past Access. Unauthenticated, ZAP only sees the
          # redirect to the login page and would "pass" without testing anything.
          urls="$(sed -nE 's/^Total of ([0-9]+) URLs.*/\1/p' zap/console.txt | tail -n 1)"
          if [ -z "${urls}" ] || [ "${urls}" -lt 3 ]; then
            echo "ZAP scanned ${urls:-no} URLs: the service token did not get past Access" >&2
            status=1
          fi
          # Any request that reached the Access login page went without the token.
          if grep -q 'cloudflareaccess\.com' zap/console.txt zap/report.md; then
            echo "ZAP reached the Access login page: some requests lacked the service token" >&2
            status=1
          fi
          # The step summary is public: publish the report only if every secret
          # and account-identifying value was redacted from it (D-37). ZAP's files
          # belong to its container user, so redact into a new file.
          if python3 .github/scripts/redact.py zap/report.md \
            "${CF_ACCESS_CLIENT_SECRET}" "${CF_ACCESS_CLIENT_ID}" \
            "${TARGET}" "${ADMIN_URL}" "${TEAM_DOMAIN}" > zap-report.md; then
            cat zap-report.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "ZAP report withheld: redaction failed." >> "${GITHUB_STEP_SUMMARY}"
            status=1
          fi
          exit "${status}"
