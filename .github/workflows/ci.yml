# CI/CD (OPS-02, SEC-10). Every action is pinned to a full commit SHA;
# Dependabot keeps the pins current. Jobs get the minimum permissions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'
  FORCE_COLOR: '0'

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (Workers runtime)
        run: npm test
      - run: npm run build
      - name: Bundle boundary check (public bundle has no admin code)
        run: npm run check:bundle

  e2e:
    name: E2E (Chromium + WebKit, axe)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run db:migrate:local
      - run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  deploy-staging:
    name: Deploy to staging
    needs: [checks, e2e, secret-scan]
    # Runs only for pushes to main, and only once the owner has finished the
    # Cloudflare setup and set the repository variable STAGING_ENABLED=true.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
    # The Cloudflare API token is NOT set job-wide: only the two steps that
    # talk to Cloudflare get it, so `npm ci` and the build (third-party code)
    # never see it.
    env:
      CLOUDFLARE_ENV: staging
    steps:
      # D-37: account-identifying values are environment *secrets*, so GitHub
      # masks them in these public logs. Tools also print shorter forms of them
      # (the bare hostname, the workers.dev subdomain, the Access team name), so
      # mask those too. Masks are per job: keep this the first step.
      - name: Mask account-identifying values in logs (D-37)
        env:
          PUBLIC_URL: ${{ secrets.STAGING_PUBLIC_URL }}
          TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
        run: |
          set -euo pipefail
          host="${PUBLIC_URL#https://}"; host="${host%%/*}"
          sub="${host#*.}"; sub="${sub%%.*}"
          team="${TEAM_DOMAIN#https://}"; team="${team%%.*}"
          for v in "${host}" "${sub}" "${team}"; do
            if [ -n "${v}" ]; then echo "::add-mask::${v}"; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build for staging
        run: npm run build
      # The exact output about to be deployed (deploy-staging.ts checks again).
      - name: Bundle check on the staging build
        run: npm run check:bundle
      - name: Apply D1 migrations (forward-only, OPS-03)
        run: npm run db:migrate:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy both Workers
        run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Kept out of the public repo; injected as Worker vars (D-37).
          STAGING_PUBLIC_URL: ${{ secrets.STAGING_PUBLIC_URL }}
          STAGING_ADMIN_URL: ${{ secrets.STAGING_ADMIN_URL }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD_ADMIN: ${{ secrets.ACCESS_AUD_ADMIN }}
      - name: Smoke test staging
        run: npm run smoke:staging
        env:
          STAGING_PUBLIC_URL: ${{ secrets.STAGING_PUBLIC_URL }}
          STAGING_ADMIN_URL: ${{ secrets.STAGING_ADMIN_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  zap-baseline:
    name: ZAP baseline scan (staging, SEC-16)
    needs: [deploy-staging]
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
    env:
      TARGET: ${{ secrets.STAGING_PUBLIC_URL }}
    steps:
      # D-37: account-identifying values are environment *secrets*, so GitHub
      # masks them in these public logs. Tools also print shorter forms of them
      # (the bare hostname, the workers.dev subdomain, the Access team name), so
      # mask those too. Masks are per job: keep this the first step.
      - name: Mask account-identifying values in logs (D-37)
        env:
          PUBLIC_URL: ${{ secrets.STAGING_PUBLIC_URL }}
          TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
        run: |
          set -euo pipefail
          host="${PUBLIC_URL#https://}"; host="${host%%/*}"
          sub="${host#*.}"; sub="${sub%%.*}"
          team="${TEAM_DOMAIN#https://}"; team="${team%%.*}"
          for v in "${host}" "${sub}" "${team}"; do
            if [ -n "${v}" ]; then echo "::add-mask::${v}"; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Access doesn't issue a session cookie to service tokens, so ZAP sends
      # the two service-token headers itself (replacer rules), scoped to the
      # staging host so they're never sent anywhere else.
      - name: Run ZAP baseline (passive) scan
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ADMIN_URL: ${{ secrets.STAGING_ADMIN_URL }}
          TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
        run: |
          set -uo pipefail
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R 777 zap
          host="${TARGET#https://}"; host="${host%%/*}"
          # The staging host only, with or without a path: ZAP also requests the
          # bare origin (no trailing slash).
          scope="^https://${host//./\\.}(/.*)?$"
          rule() { # index, header, value
            printf -- '-config replacer.full_list(%s).%s ' \
              "$1" "description=$2" "$1" "enabled=true" "$1" "matchtype=REQ_HEADER" \
              "$1" "matchstr=$2" "$1" "regex=false" "$1" "replacement=$3" \
              "$1" "url=${scope}"
          }
          zopts="$(rule 0 CF-Access-Client-Id "${CF_ACCESS_CLIENT_ID}")$(rule 1 CF-Access-Client-Secret "${CF_ACCESS_CLIENT_SECRET}")"
          zopts="${zopts% }"
          docker run --rm -v "${PWD}/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t "${TARGET}" -c rules.tsv -w report.md -I -z "${zopts}" \
            | tee zap/console.txt
          status=${PIPESTATUS[0]}
          # Prove the scan got past Access. Unauthenticated, ZAP only sees the
          # redirect to the login page and would "pass" without testing anything.
          urls="$(sed -nE 's/^Total of ([0-9]+) URLs.*/\1/p' zap/console.txt | tail -n 1)"
          if [ -z "${urls}" ] || [ "${urls}" -lt 3 ]; then
            echo "ZAP scanned ${urls:-no} URLs: the service token did not get past Access" >&2
            status=1
          fi
          # Any request that reached the Access login page went without the token.
          if grep -q 'cloudflareaccess\.com' zap/console.txt zap/report.md; then
            echo "ZAP reached the Access login page: some requests lacked the service token" >&2
            status=1
          fi
          # The step summary is public: publish the report only if every secret
          # and account-identifying value was redacted from it (D-37).
          if python3 .github/scripts/redact.py zap/report.md \
            "${CF_ACCESS_CLIENT_SECRET}" "${CF_ACCESS_CLIENT_ID}" \
            "${TARGET}" "${ADMIN_URL}" "${TEAM_DOMAIN}"; then
            cat zap/report.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "ZAP report withheld: redaction failed." >> "${GITHUB_STEP_SUMMARY}"
            status=1
          fi
          exit "${status}"
