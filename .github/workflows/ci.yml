# CI/CD (OPS-02, SEC-10). Every action is pinned to a full commit SHA;
# Dependabot keeps the pins current. Jobs get the minimum permissions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  FORCE_COLOR: '0'

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (Workers runtime)
        run: npm test
      - run: npm run build
      - name: Bundle boundary check (public bundle has no admin code)
        run: npm run check:bundle

  e2e:
    name: E2E (Chromium + WebKit, axe)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run db:migrate:local
      - run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  deploy-staging:
    name: Deploy to staging
    needs: [checks, e2e, secret-scan]
    # Runs only for pushes to main, and only once the owner has finished the
    # Cloudflare setup and set the repository variable STAGING_ENABLED=true.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: staging
    steps:
      # D-37: account-identifying values are environment *secrets*, so GitHub
      # masks them in these public logs. Tools also print shorter forms of them
      # (the bare hostname, the workers.dev subdomain, the Access team name), so
      # mask those too. Masks are per job: keep this the first step.
      - name: Mask account-identifying values in logs (D-37)
        env:
          PUBLIC_URL: ${{ secrets.STAGING_PUBLIC_URL }}
          TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
        run: |
          set -euo pipefail
          host="${PUBLIC_URL#https://}"; host="${host%%/*}"
          sub="${host#*.}"; sub="${sub%%.*}"
          team="${TEAM_DOMAIN#https://}"; team="${team%%.*}"
          for v in "${host}" "${sub}" "${team}"; do
            if [ -n "${v}" ]; then echo "::add-mask::${v}"; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build for staging
        run: npm run build
      - name: Apply D1 migrations (forward-only, OPS-03)
        run: npm run db:migrate:staging
      - name: Deploy both Workers
        run: npm run deploy:staging
        env:
          # Kept out of the public repo; injected as Worker vars (D-37).
          STAGING_PUBLIC_URL: ${{ secrets.STAGING_PUBLIC_URL }}
          STAGING_ADMIN_URL: ${{ secrets.STAGING_ADMIN_URL }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD_ADMIN: ${{ secrets.ACCESS_AUD_ADMIN }}
      - name: Smoke test staging
        run: npm run smoke:staging
        env:
          STAGING_PUBLIC_URL: ${{ secrets.STAGING_PUBLIC_URL }}
          STAGING_ADMIN_URL: ${{ secrets.STAGING_ADMIN_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  zap-baseline:
    name: ZAP baseline scan (staging, SEC-16)
    needs: [deploy-staging]
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
    env:
      TARGET: ${{ secrets.STAGING_PUBLIC_URL }}
    steps:
      # D-37: account-identifying values are environment *secrets*, so GitHub
      # masks them in these public logs. Tools also print shorter forms of them
      # (the bare hostname, the workers.dev subdomain, the Access team name), so
      # mask those too. Masks are per job: keep this the first step.
      - name: Mask account-identifying values in logs (D-37)
        env:
          PUBLIC_URL: ${{ secrets.STAGING_PUBLIC_URL }}
          TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
        run: |
          set -euo pipefail
          host="${PUBLIC_URL#https://}"; host="${host%%/*}"
          sub="${host#*.}"; sub="${sub%%.*}"
          team="${TEAM_DOMAIN#https://}"; team="${team%%.*}"
          for v in "${host}" "${sub}" "${team}"; do
            if [ -n "${v}" ]; then echo "::add-mask::${v}"; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Obtain a short-lived Access session for the scan
        id: access
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          cookie="$(curl -sS -o /dev/null -D - \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "${TARGET}/" | tr -d '\r' \
            | sed -nE 's/^[Ss]et-[Cc]ookie: CF_Authorization=([^;]+).*/\1/p' | head -n1)"
          if [ -z "${cookie}" ]; then echo "No Access session cookie returned" >&2; exit 1; fi
          echo "::add-mask::${cookie}"
          echo "cookie=${cookie}" >> "${GITHUB_OUTPUT}"
      - name: Run ZAP baseline (passive) scan
        env:
          ACCESS_COOKIE: ${{ steps.access.outputs.cookie }}
        run: |
          set -uo pipefail
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R 777 zap
          docker run --rm -v "${PWD}/zap:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER=Cookie \
            -e "ZAP_AUTH_HEADER_VALUE=CF_Authorization=${ACCESS_COOKIE}" \
            ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t "${TARGET}" -c rules.tsv -w report.md -I
          status=$?
          # Never publish the session token, even if ZAP quoted it as evidence,
          # nor the staging hostname (D-37): the summary is public.
          sed -E -i 's/CF_Authorization=[^;[:space:]]*/CF_Authorization=REDACTED/g' zap/report.md || true
          host="${TARGET#https://}"; host="${host%%/*}"
          sed -i "s#${host}#staging-public-host#g" zap/report.md || true
          cat zap/report.md >> "${GITHUB_STEP_SUMMARY}" || true
          exit "${status}"
